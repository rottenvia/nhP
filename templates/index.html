<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Modern Player</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cfc'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='900' font-size='34' fill='white' text-anchor='middle'%3E:3%3C/text%3E%3C/svg%3E">
<style>
/* Critical boot styles are inline so the :3 screen paints before any other asset loads. */
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#07070c;overflow:hidden}
#boot{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 60% at 50% 40%,rgba(124,92,252,.16),transparent 70%),#07070c;transition:opacity .45s ease,visibility .45s;font-family:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#eef;}
#boot.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
#boot .face{width:96px;height:96px;border-radius:30px;background:linear-gradient(145deg,#9d82ff,#6a4cf0);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 50px rgba(124,92,252,.45);animation:bootBob 2.6s ease-in-out infinite}
#boot .face svg{width:60px;height:60px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#boot .face .eyes{transform-origin:50% 42%;animation:bootBlink 3.6s ease-in-out infinite}
#boot .brand{margin-top:22px;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
#boot .status{margin-top:10px;font-size:13px;color:rgba(255,255,255,.7);min-height:18px}
#boot .bar{width:220px;height:3px;margin:18px auto 0;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
#boot .bar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#7c5cfc,#06b6d4);transition:width .35s ease}
#boot .card{text-align:center}
#boot .error{margin-top:14px;font-size:12px;color:#ff9a9a;max-width:360px;display:none}
#boot button{margin-top:14px;display:none;background:#7c5cfc;color:#fff;border:0;border-radius:10px;padding:8px 16px;font:600 13px inherit;cursor:pointer}
@keyframes bootBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes bootBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){#boot .face,#boot .face .eyes{animation:none}}
</style>
<link rel="stylesheet" href="/static/css/app.css?v=2.1.0">
</head>
<body>

<div id="boot" aria-live="polite">
  <div class="card">
    <div class="face"><svg viewBox="0 0 24 24"><path d="M12.1 2.3 C17.3 2.1, 21.8 6.5, 21.9 11.9 C22.0 17.3, 17.1 21.9, 11.8 21.7 C6.4 21.5, 2.2 16.8, 2.3 11.4 C2.4 6.1, 6.9 2.5, 12.1 2.3"/><g class="eyes"><path d="M8.5 9.5 A 0.8 1 0 1 1 8.5 9.4" fill="currentColor"/><path d="M15.2 10.2 A 1 0.8 0 1 1 15.2 10.1" fill="currentColor"/></g><path d="M7.5 14.5 C9.2 17.2, 14.8 16.8, 16.5 13.8"/></svg></div>
    <div class="brand">Modern Player</div>
    <div class="status" id="boot-status">Starting…</div>
    <div class="bar"><i id="boot-bar"></i></div>
    <div class="error" id="boot-error"></div>
    <button id="boot-retry" type="button">Retry</button>
  </div>
</div>

<div id="app" class="app" hidden>
  <nav class="rail" id="rail" aria-label="Main">
    <button class="rail-logo logo" data-nav="home" title="Home"><svg viewBox="0 0 24 24"><path d="M12.1 2.3 C17.3 2.1, 21.8 6.5, 21.9 11.9 C22.0 17.3, 17.1 21.9, 11.8 21.7 C6.4 21.5, 2.2 16.8, 2.3 11.4 C2.4 6.1, 6.9 2.5, 12.1 2.3"/><g class="eyes"><path d="M8.5 9.5 A 0.8 1 0 1 1 8.5 9.4" fill="currentColor"/><path d="M15.2 10.2 A 1 0.8 0 1 1 15.2 10.1" fill="currentColor"/></g><path d="M7.5 14.5 C9.2 17.2, 14.8 16.8, 16.5 13.8"/></svg></button>
    <div class="rail-items" id="rail-items"></div>
    <div class="rail-bottom">
      <button class="rail-item" id="rail-assistant" title="Assistant (Ctrl+K)">
        <span class="pill"><svg viewBox="0 0 24 24"><path d="M12 3c4.97 0 9 3.58 9 8s-4.03 8-9 8c-.9 0-1.77-.12-2.6-.34L5 21l.9-3.6C4.1 15.9 3 13.6 3 11c0-4.42 4.03-8 9-8z"/></svg></span>
        <span>Assistant</span>
      </button>
      <button class="rail-item" data-nav="settings" title="Settings">
        <span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
        <span>Settings</span>
      </button>
    </div>
  </nav>

  <main class="stage">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="nav-back" title="Back (Esc)" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h1 class="topbar-title" id="topbar-title">Home</h1>
      </div>
      <div class="topbar-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="global-search" type="search" placeholder="Search library or catalog…  ( / )" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="topbar-right" id="topbar-actions">
        <button class="btn ghost" id="btn-open-file"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Open</button>
        <button class="btn ghost" id="btn-share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Share</button>
      </div>
    </header>
    <section class="views" id="views"></section>
  </main>

  <aside class="assistant" id="assistant" aria-label="Assistant" hidden></aside>
</div>

<div id="player" class="player" hidden></div>
<div id="title-page" class="title-page" hidden></div>
<div id="modal-root"></div>
<div id="context-root"></div>
<div id="toast-root" class="toasts"></div>
<div id="drop-overlay" class="drop-overlay"><div class="drop-box"><span class="smile"><svg viewBox="0 0 24 24"><path d="M12.1 2.3 C17.3 2.1, 21.8 6.5, 21.9 11.9 C22.0 17.3, 17.1 21.9, 11.8 21.7 C6.4 21.5, 2.2 16.8, 2.3 11.4 C2.4 6.1, 6.9 2.5, 12.1 2.3"/><g class="eyes"><path d="M8.5 9.5 A 0.8 1 0 1 1 8.5 9.4" fill="currentColor"/><path d="M15.2 10.2 A 1 0.8 0 1 1 15.2 10.1" fill="currentColor"/></g><path d="M7.5 14.5 C9.2 17.2, 14.8 16.8, 16.5 13.8"/></svg></span><p>Drop media files to play</p></div></div>

<script type="module" src="/static/js/main.js?v=2.1.0"></script>
</body>
</html>
